# The heavy run: every test file compiled and all 32 invariant campaigns at full depth (256 runs x 500 calls).
# It runs on every pull request to main, and can be started by hand from the Actions tab.
# script/test.sh compiles the test files in parallel shards (one single-threaded solc per shard instead of one for
# everything). The invariant campaigns run in ONE forge process (INVARIANT_PROCS=1), exactly as a plain
# `forge test` runs them: every campaign at full runs, no split by seed. Locally `./script/test.sh full` also splits
# the campaigns by seed for speed; see the header of script/test.sh.
name: full-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: full

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # forge-std lives inside the OpenZeppelin submodule, so the checkout must be recursive.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Each shard keeps its own out/cache under out-shards/; out/ and cache/ hold the size gate's src build and the
      # deploy-script build. With the previous build restored, forge only recompiles the files that changed.
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
            out-shards
            !out-shards/logs
          key: forge-shards-${{ hashFiles('foundry.toml', 'script/test.sh') }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol') }}
          restore-keys: |
            forge-shards-${{ hashFiles('foundry.toml', 'script/test.sh') }}-

      # Neither `forge build` nor `forge test` fails on a contract above the 24,576-byte EIP-170 limit; only --sizes
      # does. v0.5.0 sat 957 bytes over that limit with every test green, so this gate is not optional.
      - name: Contract size gate (EIP-170)
        run: forge build --sizes --skip "test/**" --skip "script/**"

      # The test shards compile only the *.t.sol files and their imports, so a deploy script no test imports
      # (DeployLens, SetAffectedOffsets) would otherwise break unnoticed until deploy day. Built the way the deploy
      # wrappers run them (dynamic_test_linking off, see script/deploy-v050.sh).
      - name: Compile the deploy scripts
        run: forge build script/DeployLens.s.sol script/SetAffectedOffsets.s.sol
        env:
          FOUNDRY_DYNAMIC_TEST_LINKING: "false"

      - name: Build and run every test, invariant campaigns included
        run: ./script/test.sh full
        env:
          INVARIANT_PROCS: "1"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: out-shards/logs
